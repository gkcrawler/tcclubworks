[build]
  command = "python3 build.py && python3 inject_google_ads.py"
  publish = "."

# Public pages are root-level HTML files (contact.html, not contact/index.html).
# With Pretty URLs, /contact is 200 and both /contact/ and /contact.html 301
# to that no-slash canonical in one hop. Do not also publish contact/index.html.
[build.processing.html]
  pretty_urls = true

# www.tcclubworks.io → https://tcclubworks.io
# Requires www to be added on the Netlify site. Point www DNS at Netlify
# (CNAME www to the site hostname, or the ALIAS/ANAME Netlify documents).
[[redirects]]
  from = "https://www.tcclubworks.io/*"
  to = "https://tcclubworks.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.tcclubworks.io/*"
  to = "https://tcclubworks.io/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google.com https://www.googleadservices.com https://www.gstatic.com/recaptcha/; frame-src 'self' https://www.googletagmanager.com https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google.com https://www.googleadservices.com https://www.googletagmanager.com https://googleads.g.doubleclick.net https://pagead2.googlesyndication.com https://ad.doubleclick.net; font-src 'self' data:; connect-src 'self' https://www.google.com https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://pagead2.googlesyndication.com https://ad.doubleclick.net; form-action 'self'; base-uri 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

# /assets/* URLs are content-hashed (?v=) in the HTML, so this can be immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
