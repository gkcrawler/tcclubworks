#  ── FREQUENTLY ASKED QUESTIONS ─────────────────────────────────────────
#  These show as the drop-downs on the site AND get sent to Google as
#  structured data, which can win you extra space in search results.
#  Copy a whole [[faqs]] block to add one.

[[faqs]]
q = "How often should I regrip my clubs?"
a = "Once a season, or every 40 rounds. Grips go slick long before they look worn, and a slick grip makes you squeeze harder, which quietly wrecks your release. It's the cheapest performance gain in golf."

[[faqs]]
q = "What does a regrip actually cost me?"
a = "Our labor is $5 to $10 per club. Grips themselves run about $6 to $15 each depending on the model, so a full set of 13 usually lands between $110 and $250 all in. You're welcome to supply your own grips."

[[faqs]]
q = "How long does the work take?"
a = "Most regripping and loft and lie work is turned around in a few days. Reshafts and restorations depend on parts availability. We'll give you a timeline when we quote."

[[faqs]]
q = "Do you work on graphite as well as steel?"
a = "Yes. We install premium steel and graphite shafts and frequency match them across the set so the feel stays consistent through the bag."

[[faqs]]
q = "Where are you located?"
a = "We work out of the Denver metro by appointment, serving Denver, Lakewood, Arvada, Westminster, Littleton, Englewood, Aurora and the wider Front Range. Call or message and we'll set a time."

[[faqs]]
q = "Is it worth restoring an old club?"
a = "Sometimes yes, sometimes no. Send photos and we'll tell you honestly. Some clubs are worth it for how they play, some for what they mean, and some are better replaced."


